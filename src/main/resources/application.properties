spring.application.name=knowledge-base-helpdesk

server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Session cookie hardening: not readable from JavaScript, and not sent on
# cross-site POST requests (basic CSRF mitigation for the session-based login).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
# Keep the session ID out of URLs (no ;jsessionid=... rewriting).
server.servlet.session.tracking-modes=cookie

# Never expose stack traces or exception messages on the error page.
server.error.include-stacktrace=never
server.error.include-message=never
