<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' — Knowledge Base Helpdesk'">Article Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
    <div class="brand">
        <span class="brand-icon" aria-hidden="true">📚</span>
        Knowledge Base Helpdesk
    </div>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/articles">Articles</a>
        <div class="nav-divider" aria-hidden="true"></div>
        <a href="/logout">Sign Out</a>
    </div>
</nav>

<main class="container">

    <div class="breadcrumb" aria-label="Breadcrumb">
        <a href="/dashboard">Dashboard</a>
        <span class="breadcrumb-sep" aria-hidden="true">›</span>
        <a href="/articles">Articles</a>
        <span class="breadcrumb-sep" aria-hidden="true">›</span>
        <span th:text="${pageTitle}">Form</span>
    </div>

    <div class="form-card">

        <h1 th:text="${pageTitle}">Article Form</h1>

        <form method="post" th:action="${action}">

            <label for="title">Title</label>
            <input type="text"
                   id="title"
                   name="title"
                   th:value="${article.title}"
                   placeholder="Enter a descriptive article title"
                   required>

            <label for="description">Problem Description</label>
            <textarea id="description"
                      name="description"
                      rows="5"
                      required
                      placeholder="Describe the problem this article addresses"
                      th:text="${article.description}"></textarea>

            <label for="solution">Solution</label>
            <textarea id="solution"
                      name="solution"
                      rows="8"
                      required
                      placeholder="Provide the step-by-step solution"
                      th:text="${article.solution}"></textarea>

            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="DRAFT"
                        th:selected="${article.status != null and article.status.name() == 'DRAFT'}">
                    Draft
                </option>

                <option value="PUBLISHED"
                        th:selected="${article.status == null or article.status.name() == 'PUBLISHED'}">
                    Published
                </option>

                <option value="RESOLVED"
                        th:selected="${article.status != null and article.status.name() == 'RESOLVED'}">
                    Resolved
                </option>
            </select>

            <div class="actions">
                <button type="submit">💾 Save Article</button>
                <a class="button button-secondary" href="/articles">Cancel</a>
            </div>

        </form>

    </div>

</main>

</body>
</html>
