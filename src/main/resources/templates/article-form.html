<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle}"></title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
    <div class="brand">Knowledge Base Helpdesk</div>
    <div>
        <a href="/articles">Articles</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<div class="container">

    <div class="form-card">

        <h1 th:text="${pageTitle}"></h1>

        <form method="post" th:action="${action}">

            <label>Title</label>
            <input type="text"
                   name="title"
                   th:value="${article.title}"
                   required>

            <label>Problem Description</label>
            <textarea name="description"
                      rows="5"
                      required
                      th:text="${article.description}"></textarea>

            <label>Solution</label>
            <textarea name="solution"
                      rows="8"
                      required
                      th:text="${article.solution}"></textarea>

            <label>Status</label>
            <select name="status">
                <option value="DRAFT"
                        th:selected="${article.status != null and article.status.name() == 'DRAFT'}">
                    Draft
                </option>

                <option value="PUBLISHED"
                        th:selected="${article.status == null or article.status.name() == 'PUBLISHED'}">
                    Published
                </option>

                <option value="RESOLVED"
                        th:selected="${article.status != null and article.status.name() == 'RESOLVED'}">
                    Resolved
                </option>
            </select>

            <div class="actions">
                <button type="submit">Save Article</button>
                <a class="button" href="/articles">Cancel</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
