<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Articles — Knowledge Base Helpdesk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
    <div class="brand">
        <span class="brand-icon" aria-hidden="true">📚</span>
        Knowledge Base Helpdesk
    </div>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/articles">Articles</a>
        <div class="nav-divider" aria-hidden="true"></div>
        <a href="/logout">Sign Out</a>
    </div>
</nav>

<main class="container">

    <div class="page-header">
        <div>
            <h1>Knowledge Articles</h1>
            <p>Search and browse solutions to common problems.</p>
        </div>

        <a class="button"
           th:if="${role == 'ADMIN' or role == 'SUPPORT'}"
           href="/articles/new">
            + Create Article
        </a>
    </div>

    <form class="search" method="get" action="/articles" role="search">
        <label for="keyword" class="sr-only">Search articles</label>
        <input type="text"
               id="keyword"
               name="keyword"
               th:value="${keyword}"
               placeholder="Search by title, problem or solution…">

        <button type="submit">🔍 Search</button>
    </form>

    <div class="article-list">

        <div class="article"
             th:each="article : ${articles}">

            <div class="article-content">
                <h2>
                    <a th:href="@{/articles/{id}(id=${article.id})}"
                       th:text="${article.title}">
                    </a>
                </h2>

                <p th:text="${article.description}"></p>

                <div class="article-meta">
                    <span class="status"
                          th:classappend="'status-' + ${article.status}"
                          th:text="${article.status}">
                    </span>
                    <span th:if="${article.author}" th:text="'By ' + ${article.author}"></span>
                </div>
            </div>

            <div class="article-actions">

                <a class="button-small"
                   th:href="@{/articles/{id}(id=${article.id})}">
                    View
                </a>

                <a class="button-small button-secondary"
                   th:if="${role == 'ADMIN' or role == 'SUPPORT'}"
                   th:href="@{/articles/edit/{id}(id=${article.id})}">
                    Edit
                </a>

                <form th:if="${role == 'ADMIN'}"
                      th:action="@{/articles/delete/{id}(id=${article.id})}"
                      method="post"
                      style="margin:0;">
                    <button class="danger-small" type="submit"
                            onclick="return confirm('Are you sure you want to delete this article?')">
                        Delete
                    </button>
                </form>

            </div>
        </div>

        <div class="empty"
             th:if="${#lists.isEmpty(articles)}">
            No matching articles found. Try a different search term.
        </div>

    </div>

</main>

</body>
</html>
